<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" opacity="0.1"/>

  <!-- Globe container -->
  <g transform="translate(256, 280)">
    <!-- Globe circle -->
    <circle cx="0" cy="0" r="100" fill="url(#globeGradient)" opacity="0.15" stroke="url(#bgGradient)" stroke-width="2"/>

    <!-- Globe grid lines -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#bgGradient)" stroke-width="1.5" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="100" ry="35" fill="none" stroke="url(#bgGradient)" stroke-width="1.5" opacity="0.3"/>
    <path d="M -70 0 Q -70 70 0 100 Q 70 70 70 0 Q 70 -70 0 -100 Q -70 -70 -70 0" fill="none" stroke="url(#bgGradient)" stroke-width="1.5" opacity="0.3"/>

    <!-- Continents outline (simplified) -->
    <path d="M -20 -40 L 10 -50 L 30 -30 L 20 -10 L 10 -5 Z" fill="url(#bgGradient)" opacity="0.6"/>
    <path d="M -60 20 L -40 10 L -30 40 L -55 50 Z" fill="url(#bgGradient)" opacity="0.6"/>
    <path d="M 40 30 L 70 20 L 75 50 L 50 60 Z" fill="url(#bgGradient)" opacity="0.6"/>

    <!-- Globe shine -->
    <ellipse cx="-30" cy="-30" rx="50" ry="40" fill="white" opacity="0.1"/>
  </g>

  <!-- Trending chart (top right) -->
  <g transform="translate(330, 100)">
    <!-- Chart background circle -->
    <circle cx="0" cy="0" r="45" fill="#FFFFFF" opacity="0.1" stroke="url(#bgGradient)" stroke-width="1.5"/>

    <!-- Chart bars with gradient -->
    <!-- Bar 1 -->
    <rect x="-24" y="-8" width="8" height="16" fill="url(#bgGradient)" opacity="0.7" rx="2"/>

    <!-- Bar 2 -->
    <rect x="-8" y="-20" width="8" height="28" fill="url(#bgGradient)" opacity="0.85" rx="2"/>

    <!-- Bar 3 (trending up) -->
    <rect x="8" y="-28" width="8" height="36" fill="url(#bgGradient)" rx="2"/>

    <!-- Trending arrow -->
    <path d="M 28 -8 L 32 -16 L 36 -8" fill="none" stroke="url(#bgGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="32" y1="-16" x2="32" y2="0" stroke="url(#bgGradient)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Pulse/Activity indicator (bottom) -->
  <g transform="translate(256, 420)">
    <!-- Pulse circles -->
    <circle cx="0" cy="0" r="6" fill="url(#bgGradient)"/>
    <circle cx="0" cy="0" r="12" fill="url(#bgGradient)" opacity="0.4"/>
    <circle cx="0" cy="0" r="18" fill="url(#bgGradient)" opacity="0.2"/>
  </g>

  <!-- Logo text -->
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="url(#bgGradient)">
    IssueGlobe
  </text>
  <text x="256" y="505" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="url(#bgGradient)" opacity="0.7">
    Real-Time Global Trends
  </text>
</svg>